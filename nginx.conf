server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so host/port mappings from docker run are preserved.
  absolute_redirect off;

  location / {
    # Serve nested static routes like /blog and /music directly.
    try_files $uri $uri/index.html $uri/ =404;
  }
}
